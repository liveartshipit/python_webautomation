name: Sync chatbot knowledge

on:
  schedule:
    - cron: "17 21 * * *" # daily, 02:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/faq.json"
      - "scripts/build-knowledge.mjs"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build knowledge.json from worksmarto.com
        run: node scripts/build-knowledge.mjs
      - name: Commit if changed
        run: |
          git config user.name "worksmarto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/knowledge.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Sync knowledge from worksmarto.com"
          git push
      - name: Purge jsDelivr cache for widget files
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/faq.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/widget/chatbot.js" || true
